---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app: homepage
data:
  kubernetes.yaml: |
    mode: cluster
  settings.yaml: |
    title: Nexus
    headerStyle: clean
    theme: dark
    color: slate
    useEqualHeights: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      showSearchSuggestions: true
      hideVisitURL: true
    hideVersion: true
    hideErrors: true
    statusStyle: "dot"
    layout:
      Media:
        header: true
        style: row
        columns: 3
      Movies & TV:
        header: true
        style: row
        columns: 3
      Anime & Books:
        header: true
        style: row
        columns: 3
      Discovery:
        header: true
        style: row
        columns: 2
      Reading:
        header: true
        style: row
        columns: 2
      Infrastructure:
        header: true
        style: row
        columns: 3
      Hardware:
        header: true
        style: row
        columns: 3
      Calendar:
        header: false
        style: row

  custom.css: |
    /* === Catppuccin Mocha === */

    /* Page background */
    body { background-color: #1e1e2e !important; }

    /* Service cards */
    .service-card {
      background-color: #313244 !important;
      border-color: #45475a !important;
    }

    /* Stat sub-cells */
    .service-tag { background-color: #181825 !important; }
    .service-tag p { color: #a6adc8 !important; }
    .service-tag p:first-child { color: #cdd6f4 !important; font-weight: 500 !important; }

    /* Top bar widgets */
    .information-widget-base {
      background-color: #313244 !important;
      border-color: #45475a !important;
      color: #cdd6f4 !important;
    }

    /* Group section headers */
    .service-group-header span, h2.service-group-header {
      color: #b4befe !important;
      font-size: 0.65rem !important;
      letter-spacing: 0.12em !important;
      text-transform: uppercase !important;
      font-weight: 600 !important;
      opacity: 1 !important;
    }
  custom.js: ""
  bookmarks.yaml: |

  services.yaml: |
    - Media:
      - Jellyfin:
          icon: jellyfin.png
          href: https://jellyfin.nexus-core.dev
          description: Media center
          siteMonitor: https://jellyfin.nexus-core.dev
          widgets:
            - type: jellyfin
              url: https://jellyfin.nexus-core.dev
              key: {{HOMEPAGE_VAR_JELLYFIN}}
              fields: ["albums", "movies", "tv"]
      - Jellyseer:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/jellyseerr.png
          href: https://jellyseer.nexus-core.dev
          description: Media discovery
          siteMonitor: https://jellyseer.nexus-core.dev
          widget:
            type: jellyseerr
            url: https://jellyseer.nexus-core.dev
            key: {{HOMEPAGE_VAR_JELLYSEER}}
      - Sabnzbd:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/sabnzbd.png
          href: http://192.168.10.50:8100
          description: Usenet downloader
          siteMonitor: http://192.168.10.50:8100
          widget:
            type: sabnzbd
            url: http://192.168.10.50:8100
            key: {{HOMEPAGE_VAR_SABNZBD_KEY}}

    - Movies & TV:
      - Radarr:
          icon: radarr.png
          href: https://radarr.nexus-core.org
          description: Movie management
          siteMonitor: https://radarr.nexus-core.org
          widget:
            type: radarr
            url: https://radarr.nexus-core.org
            key: {{HOMEPAGE_VAR_RADARR}}
      - Sonarr:
          icon: sonarr.png
          href: https://sonarr.nexus-core.org
          description: TV series management
          siteMonitor: https://sonarr.nexus-core.org
          widget:
            type: sonarr
            url: https://sonarr.nexus-core.org
            key: {{HOMEPAGE_VAR_SONARR}}
      - Lidarr:
          icon: lidarr.png
          href: https://lidarr.nexus-core.org
          description: Music management
          siteMonitor: https://lidarr.nexus-core.org
          widget:
            type: lidarr
            url: https://lidarr.nexus-core.org
            key: {{HOMEPAGE_VAR_LIDARR}}

    - Anime & Books:
      - Radarr (Anime):
          icon: radarr.png
          href: https://radarr-anime.nexus-core.org
          description: Anime movie management
          siteMonitor: https://radarr-anime.nexus-core.org
          widget:
            type: radarr
            url: https://radarr-anime.nexus-core.org
            key: {{HOMEPAGE_VAR_RADARR_ANIME}}
      - Sonarr (Anime):
          icon: sonarr.png
          href: https://sonarr-anime.nexus-core.org
          description: Anime series management
          siteMonitor: https://sonarr-anime.nexus-core.org
          widget:
            type: sonarr
            url: https://sonarr-anime.nexus-core.org
            key: {{HOMEPAGE_VAR_SONARR_ANIME}}
      - Readarr:
          icon: readarr.png
          href: https://readarr.nexus-core.org
          description: Book series management
          siteMonitor: https://readarr.nexus-core.org
          widget:
            type: readarr
            url: https://readarr.nexus-core.org
            key: {{HOMEPAGE_VAR_READARR}}

    - Discovery:
      - Prowlarr:
          icon: prowlarr.png
          href: https://prowlarr.nexus-core.org
          description: Indexer management
          siteMonitor: https://prowlarr.nexus-core.org
          widget:
            type: prowlarr
            url: https://prowlarr.nexus-core.org
            key: {{HOMEPAGE_VAR_PROWLARR}}
            fields: ["numberOfGrabs","numberOfQueries"]
      - Huntarr:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/huntarr.png
          href: https://huntarr.nexus-core.org
          description: Missing content management
          siteMonitor: https://huntarr.nexus-core.org

    - Reading:
      - Kavita:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/kavita.svg
          href: https://books.nexus-core.org
          description: Book reading
          siteMonitor: https://books.nexus-core.org
      - Calibre Web:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/calibre-web.svg
          href: https://calibreweb.nexus-core.org
          description: Book processing
          siteMonitor: https://calibreweb.nexus-core.org

    - Infrastructure:
      - Adguard:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/adguard-home.png
          href: https://adguard.nexus-core.dev
          description: DNS & ad blocking
          siteMonitor: https://adguard.nexus-core.dev
          widget:
            type: adguard
            url: https://adguard.nexus-core.dev
            username: {{HOMEPAGE_VAR_ADGUARD_USERNAME}}
            password: {{HOMEPAGE_VAR_ADGUARD_PASSWORD}}
      - Portainer:
          icon: portainer.png
          href: https://portainer.nexus-core.org
          description: Docker management
          siteMonitor: https://portainer.nexus-core.org
          widget:
            type: portainer
            url: https://portainer.nexus-core.org
            env: 3
            key: {{HOMEPAGE_VAR_PORTAINER-KEY}}
            fields: ["running","stopped"]
      - Proxy Manager:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/nginx-proxy-manager.png
          href: https://nginxreverseproxy.nexus-core.dev
          description: Certificate management
          siteMonitor: https://nginxreverseproxy.nexus-core.dev

    - Hardware:
      - Network:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/ubiquiti-unifi.png
          href: https://network.nexus-core.org/
          description: Network control
          siteMonitor: https://network.nexus-core.org/
      - UNAS Pro:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/ugreen-nas.png
          href: https://drive.nexus-core.org/
          description: Primary NAS
          siteMonitor: https://drive.nexus-core.org/
      - Proxmox Main:
          icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/proxmox.png
          href: https://proxmox1.nexus-core.org
          description: Virtualization
          siteMonitor: https://proxmox1.nexus-core.org

    - Calendar:
      - " ":
          widget:
            type: calendar
            firstDayInWeek: sunday
            view: monthly
            showTime: true
            timezone: America/New_York
            integrations:
              - type: sonarr
                service_group: Movies & TV
                service_name: Sonarr
                color: blue
                params:
                  unmonitored: false
              - type: radarr
                service_group: Movies & TV
                service_name: Radarr
                color: yellow
                params:
                  unmonitored: false
              - type: sonarr
                service_group: Anime & Books
                service_name: Sonarr (Anime)
                color: green
                params:
                  unmonitored: false
              - type: radarr
                service_group: Anime & Books
                service_name: Radarr (Anime)
                color: pink
                params:
                  unmonitored: false
              - type: lidarr
                service_group: Movies & TV
                service_name: Lidarr
                color: teal
                params:
                  unmonitored: false

  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - search:
        provider: google
        target: _blank
        showSearchSuggestions: true
    - openmeteo:
        label: Boston
        latitude: 42.496691
        longitude: -70.947365
        timezone: US/Eastern
        units: imperial
        cache: 5
        format:
          maximumFractionDigits: 1
  docker.yaml: ""
